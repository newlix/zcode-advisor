[package]
name = "zcode-consultant"
version = "3.1.12"
edition = "2021"
description = "ZCode advisor tool: MCP stdio server (rmcp) + hooks"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "time", "sync"] }
dirs = "6"
toml = "1"
# TLS for the generic openai backend. default-features = false + rustls pins the
# TLS stack to rustls (bundled webpki roots, no system cert store, no openssl);
# a future default-feature change upstream must not silently pull native-tls.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
strip = true # strip symbols from release binaries to save size; this project doesn't rely on symbolized backtraces
