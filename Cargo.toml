[package]
name = "zcode-advisor"
version = "3.0.0"
edition = "2021"
description = "ZCode advisor tool: MCP stdio server (rmcp) + hooks"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "time", "sync"] }
dirs = "6"
