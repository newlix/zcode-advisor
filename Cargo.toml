[package]
name = "zcode-advisor"
version = "3.0.1"
edition = "2021"
description = "ZCode advisor tool: MCP stdio server (rmcp) + hooks"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "time", "sync"] }
dirs = "6"

[profile.release]
strip = true # 發布 binary 去符號省體積；本專案不依賴符號化 backtrace
