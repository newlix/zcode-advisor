# Continuous verification: tests + cross-platform builds (no publishing). The release pipeline lives in release.yml (tag-triggered).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      # rustls (openai backend) pulls in ring, which compiles C for the target:
      # musl-tools provides the x86_64 musl gcc wrapper; for aarch64 we use the
      # apt gcc-aarch64-linux-gnu cross gcc (musl.cc would also work but is
      # routinely unreachable from GitHub runners — curl timed out there).
      # Linking is done by rust-lld in both cases; ring's C objects are
      # freestanding, so a gnu-target gcc is fine for compiling them.
      - name: install musl C cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - run: cargo test --release --locked
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          RUSTFLAGS: -C linker=rust-lld
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl
        env:
          RUSTFLAGS: -C linker=rust-lld
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --release --locked
