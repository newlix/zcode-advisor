# Continuous verification: tests + cross-platform builds (no publishing). The release pipeline lives in release.yml (tag-triggered).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - run: cargo test --release --locked
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl
        env:
          RUSTFLAGS: -C linker=rust-lld

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --release --locked
