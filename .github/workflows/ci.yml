# Continuous verification: tests + cross-platform builds (no publishing). The release pipeline lives in release.yml (tag-triggered).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      # rustls (openai backend) pulls in ring, which compiles C for the target:
      # musl-tools provides the x86_64 musl gcc wrapper, musl.cc the aarch64
      # musl cross toolchain (the cc crate auto-detects aarch64-linux-musl-gcc).
      # TODO: pin the musl.cc tarball (sha256sum) so supply-chain audits don't
      # depend on musl.cc's own integrity alone
      - name: install musl C cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          curl -sSfL https://musl.cc/aarch64-linux-musl-cross.tgz | tar -xz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
      - run: cargo test --release --locked
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          RUSTFLAGS: -C linker=rust-lld
          CC_x86_64_unknown_linux_musl: musl-gcc
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl
        env:
          RUSTFLAGS: -C linker=rust-lld
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --release --locked
