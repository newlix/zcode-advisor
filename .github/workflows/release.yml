# Release pipeline: pushing a v* tag builds binaries for five platforms and
# attaches them, with checksums, to a GitHub Release.
# Naming: zcode-advisor-<tag>-<target>.tar.gz (.zip on Windows)
# Linux uses static musl linking (runs on any distro); aarch64 cross-compiles with rust-lld
# (no C dependencies, self-contained musl; verified locally and in CI).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag must match the Cargo.toml version (guards against tagging before bumping)
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ "$v" = "${{ github.ref_name }}" ] || { echo "mismatch: tag=${{ github.ref_name }} Cargo.toml=$v"; exit 1; }

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            rustflags: -C linker=rust-lld
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: tar -czf zcode-advisor-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release zcode-advisor
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\${{ matrix.target }}\release\zcode-advisor.exe -DestinationPath zcode-advisor-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: zcode-advisor-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: checksums
        run: sha256sum zcode-advisor-* | tee checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zcode-advisor-*
            checksums.txt
          generate_release_notes: true
