# Release pipeline: pushing a v* tag builds binaries for five platforms and
# attaches them, with checksums, to a GitHub Release.
# Naming: zcode-consultant-<tag>-<target>.tar.gz (.zip on Windows)
# Linux uses static musl linking (runs on any distro); aarch64 cross-compiles
# with rust-lld. Since the openai backend pulled in rustls/ring (C code), the
# musl targets need a C cross toolchain: musl-tools (x86_64) and musl.cc
# (aarch64); ring's C objects are statically linked, the binaries stay static.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag must match the Cargo.toml version (guards against tagging before bumping)
        run: |
          v="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ "$v" = "${{ github.ref_name }}" ] || { echo "mismatch: tag=${{ github.ref_name }} Cargo.toml=$v"; exit 1; }

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rustflags: -C linker=rust-lld
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            rustflags: -C linker=rust-lld
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl C cross toolchain (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: install musl C cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        # apt's gnu cross gcc compiles ring's freestanding C; musl.cc is
        # routinely unreachable from GitHub runners
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
      - name: package (unix)
        if: runner.os != 'Windows'
        run: tar -czf zcode-consultant-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release zcode-consultant
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\${{ matrix.target }}\release\zcode-consultant.exe -DestinationPath zcode-consultant-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: zcode-consultant-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: checksums
        run: sha256sum zcode-consultant-* | tee checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zcode-consultant-*
            checksums.txt
          generate_release_notes: true
